name: fast
description: Fast Delivery App - أسرع تطبيق توصيل في تعز.
publish_to: 'none'
version: 2.2.0+2

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.8.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.1
  firebase_messaging: ^15.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # 👈 أضفنا مكتبة توليد الأيقونات هنا

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon.png

# 👈 إعدادات توليد الأيقونة تلقائياً لشعارك في التطبيق
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: false
  image_path_android: "assets/images/app_icon.png"
